name: Generate and Publish Docs

on:
  push:
    branches:
      - main  # Adjust this to your default branch

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v2
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx breathe sphinx_rtd_theme
        
    - name: Install Doxygen
      run: sudo apt-get install -y doxygen
    
    - name: Generate Doxygen documentation
      run: |
        cd docs
        doxygen Doxyfile
    
    - name: Generate Sphinx documentation
      run: |
        cd docs/sphinx
        sphinx-build -b html . _build/html
    
    - name: Checkout the docs repository
      uses: actions/checkout@v2
      with:
        repository: arunmudhaliar/docs
        path: docs_repo
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Copy generated docs to the docs repository
      run: |
        rsync -av --delete docs/sphinx/_build/html/ docs_repo/docs/gearsdk-docs/
      
    - name: Commit and push changes
      run: |
        cd docs_repo
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add .
        git commit -m "Update Gearsdk documentation"
        git push
