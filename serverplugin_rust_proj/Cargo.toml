[package]
name = "serverplugin_rust_proj"
version = "0.1.0"
edition = "2021"

[profile.dev]
# rustflags = ["-A", "non_camel_case_types"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sha2 = "0.10"
regex = "1"
chrono = "0.4"
signal-hook = "0.3"
mongodb = "3.1.1"
bson = "2.0"
crc32fast = "1.3"
tokio = { version = "1", features = ["full"] }
async-std = "1.12"
redis = { version = "0.28.1", features = ["tokio-rustls-comp"] }
log = "0.4"
once_cell = "1.10.0"
zookeeper = "0.8"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }  # For JSON serialization/deserialization
serde_json = "1.0"              # For working with JSON
anyhow = "1.0"                  # For better error handling
async-trait = "0.1"             # For using async functions in traits